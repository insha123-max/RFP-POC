services:
  bideval:
    build: .
    ports:
      - "1500:8000"
    environment:
      - OLLAMA_BASE_URL=http://172.30.111.58:11434
      - DATABASE_URL=postgresql://postgres:admin@db:5432/bideval
      - JWT_SECRET=change-me-use-a-strong-secret-in-production
      # Comma-separated allow-list — these @globallogic.com emails get role="admin" at signup.
      - ADMIN_EMAILS=
    volumes:
      - ./prompts:/app/prompts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bideval
      POSTGRES_USER: bideval
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bideval -d bideval"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
